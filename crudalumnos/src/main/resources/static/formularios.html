    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

</head>

        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menulateral"
            aria-controls="#menulateral">
            <span class="navbar-toggler-icon"></span>
        </button> <!-- Hamburguesa -->

        <section class="d-flex gap-1">
            <a routerLink="/index.html" href="/index.html" routerLinkActive="btn-primary"

            <a routerLink="/grid.html" href="/grid.html" routerLinkActive="btn-primary"
                class="btn btn-outline-light text-info">Grid</a>
            <a routerLink="/componentes.html" href="/componentes.html" routerLinkActive="btn-primary"
                class="btn btn-outline-light text-info">Componentes</a>
            <a routerLink="/formularios.html" href="/formularios.html" routerLinkActive="btn-primary"

            <form class="position-relative col-4">
                <input type="search" name="buscar" id="buscar" placeholder="Buscar..." class="form-control pe-5">
                <button class="btn btn-sm text-info position-absolute top-50 end-0 translate-middle-y me-1"

        </section>
    </nav>

    <!-- Panel lateral (hay que poner IDs!)-->
    <nav class="offcanvas offcanvas-start bg-primary text-light" tabindex="-1" id="menulateral">
        <section class="offcanvas-header">
            <h5 class="offcanvas-title">PRINCIPAL</h5>
            <button type="button" class="btn btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>

        <section class="offcanvas-body flex-column d-flex gap-1">
            <a routerLink="/index.html" href="/index.html" routerLinkActive="active"
                class="nav-link text-light">Inicio</a>
            <a routerLink="/grid.html" href="/grid.html" routerLinkActive="active" class="nav-link text-light">Grid</a>
            <a routerLink="/componentes.html" href="/componentes.html" routerLinkActive="active"
                class="nav-link text-light">Componentes</a>

            <!-- Enlace a la página actual diferente -->

    <!-- CONTENIDO PRINCIPAL (FORMULARIO) -->
    <main class="container my-3">
        <header class="mb-3">
            <h1>Formulario</h1>
            <p class="text-muted m-0">Alta de Alumno/Alumna</p>
        </header>
        <!--Mensajes de estado (Ej: Alumno insertado) -->
        <p id="alerta" class="alert alert-info mb-4 d-none"></p>


        <!--Vamos a seleccionar que endpoints usará el formulario-->
        <section class="card mb-4">
            <header class="card-header bg-primary text-white">
                Modo de inserción (Enpoint1 o endpoint2)</header>
            <fieldset class="card-body">
                <input class="form-check-input" type="radio" name="modo" value="json" id="modoJSON" checked>
                <label class="form-check-label" for="modoJSON">JSON
                    <code class="text-muted">(/api/alumnos/crear)</code></label>

                <br>

                <input class="form-check-input" type="radio" name="modo" value="param" id="modoParam">
                <label class="form-check-label" for="modoParam">Param
                    <code class="text-muted">(/api/alumnos/crear/{nif}/{nombre}/{edad}/{genero})</code></label>

            </fieldset>
        </section>

        <section class="card mb-4">
            <!--El resto del formulario-->
            <header class="card-header bg-success text-light">
                Nuevo Alumno / Alumna
            </header>

            <form onsubmit="crearAlumno (); return false;">
                <section class="card-body">
                    <fieldset class="row g-3">
                        <section class="col-12 col-md-3">
                            NIF<label class="form-label text-danger" for="nif">*</label>
                            <input class="form-control" type="text" id="nif" required>
                        </section>

                        <section class="col-12 col-md-3">
                            Nombre<label class="form-label text-danger" for="nombre">*</label>
                            <input class="form-control" type="text" id="nombre" required>
                        </section>

                        <section class="col-12 col-md-3">
                            Edad<label class="form-label text-danger" for="edad">*</label>
                            <input class="form-control" type="number" id="edad" required>
                        </section>

                        <section class="col-12 col-md-3">
                            Género<label class="form-label text-danger" for="genero">*</label>

                            <select class="form-select" name="genero" id="genero" required>
                                <option disabled selected>Seleccione opción</option>
                                <option value="1">Mujer</option>
                                <option value="0">Hombre</option>

                            </select>
                        </section>

                    </fieldset>

                    <!--Para visualizar lo que envia al endpoint-->
                    <nav class="card mt-3">
                        <p class="text-muted mb-1 p-2">Se enviará: </p>
                        <pre id="preview" class="bg-body-secondary border rounded p-2 mb-1">
                            <code class="m-2">----</code>
                        </pre>
                    </nav>
                </section>

                <!-- El pie del formulario es para enviar o limpiar-->

                <footer class="card-footer d-print-flex gap-2">
                    <button type="submit" class="btn btn-success"
                        onsubmit="crearAlumno(); return false;">Guardar</button>
                    <button type="reset" class="btn btn-warning" onclick="limpiar();">Limpiar</button>
                </footer>
            </form>


        </section>
    </main>

    <footer class="card-footer p-2 mx-auto col-6">
        <section class="card bg-light">
            <p class="pt-2 ps-5 text-info">
                <sup>*</sup> Requerido
            </p>
        </section>
    </footer>

    <script src="bootstrap.bundle.min.js"></script>
    <!--Debajo del JS de BS defino toda la parte de gestion del formulario-->

    <script>
        // 1. Recogemos que opción vamos a usar
        // Esta función devuelve "json" o "param"
        function modoActual() {
            return document.querySelector('input[name="modo"]:checked').value;
        }

        // 2. Leer campos del formulario uno x uno
        function leerCampos() {
            const nif = document.getElementById('nif').value.trim();
            const nombre = document.getElementById('nombre').value.trim();
            const edad = parseInt(document.getElementById('edad').value); //Es Num!
            const genero = document.getElementById('genero').value;

            // Devuelve un diccionario (copiado de python)
            return { nif, nombre, edad, genero: genero === '1' };
        }


        // 3 función para crear el alumno
        // 3.1 Usar el enpoint /api/alumnos/crear
        // 3.2 USar el enpoint /api/alumnos/crear/{nif}/{nombre}/{edad}/{genero}

        async function crearAlumno() {
            const datos = leerCampos();
            let url;    //endpoint
            let opciones;


            // JSON es el que más se usa
            if (modoActual() === 'json') {
                url = '/api/alumnos/crear'
                opciones = {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                };
            }
            else {
                // Usamos string Literal de JS -> ${datos.}
                url = '/api/alumnos/crear/${datos.nif}/${datos.nombre}/${datos.edad}/${datos.genero}';
                opciones = { method: 'POST' }
            }


            // await (espera en segundo plano)-> necesita async!!
            try {
                const respuesta = await fetch(url, opciones);
            } catch (error) { }

        }
    </script>
</body>

</html>
